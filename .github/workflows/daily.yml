name: Daily Reads

on:
  schedule:
    - cron: "40 1 * * *"      # 05:40 Mauritius (01:40 UTC) so the batch is ready by 06:00 — GitHub can start runs a few minutes late
  workflow_dispatch:           # "Run workflow" button / the 📰 button on the home server
    inputs:
      mode:
        description: "full = new Gemini batch + any new ChatGPT batch; chatgpt = only import new ChatGPT batches"
        default: full
        type: choice
        options: [full, chatgpt]
  push:                        # ChatGPT pushed a new batch → import it right away (ChatGPT only, no extra Gemini batch)
    branches: [main]
    paths: [state/chatgpt_picks.json]

permissions:
  contents: write

concurrency:
  group: daily-reads
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install requests==2.32.3

      - name: Curate and build the feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RUN_MODE: ${{ github.event_name == 'push' && 'chatgpt' || inputs.mode || 'full' }}
          FEED_TITLE: Daily Reads
          FEED_LINK: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python curate.py

      - name: Save
        id: save
        run: |
          git config user.name "daily-reads-bot"
          git config user.email "daily-reads-bot@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Daily reads $(date -u +%F) (${{ github.event_name }})"
          # If something else was pushed meanwhile (e.g. a settings change), catch up and retry.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase -X theirs origin main
            sleep 5
          done
          exit 1

      - name: Confirm the live feed is updated
        if: steps.save.outputs.changed == 'true'
        run: |
          FEED="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml"
          FEED=$(echo "$FEED" | tr '[:upper:]' '[:lower:]')
          WANT=$(grep -o '<lastBuildDate>[^<]*' docs/feed.xml | head -1)
          # GitHub Pages usually publishes within ~1 minute; check every 10 s for up to 6 minutes.
          for i in $(seq 1 36); do
            GOT=$(curl -s "$FEED?v=$GITHUB_SHA-$i" | grep -o '<lastBuildDate>[^<]*' | head -1)
            if [ "$GOT" = "$WANT" ]; then
              echo "Live feed updated after $((i*10)) s"
              # WebSub ping: readers that support it fetch the new items straight away.
              curl -s -o /dev/null -w "WebSub ping: %{http_code}\n" -d hub.mode=publish --data-urlencode "hub.url=$FEED" https://pubsubhubbub.appspot.com/ || true
              exit 0
            fi
            sleep 10
          done
          echo "::error::The live feed did not show this update within 6 minutes"
          exit 1
