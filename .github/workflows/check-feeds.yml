name: Check feeds (one-off)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests==2.32.3 && python tools/check_feeds.py
      - run: |
          git config user.name "daily-reads-bot"; git config user.email "daily-reads-bot@users.noreply.github.com"
          git add tools/feed-check.json && git commit -m "Feed check results" && (git push || (git pull --rebase -X theirs origin main && git push))
